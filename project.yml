# Generate Hush.xcodeproj with XcodeGen: `xcodegen generate`
# Change APP_BUNDLE_ID and DEVELOPMENT_TEAM before building for a device.
name: Hush

options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    # Kept from the app's earlier name: a free Apple account can register only
    # 10 App IDs per week. Change it once on the paid Developer Program.
    APP_BUNDLE_ID: com.talhaarshad.adshield
    APP_GROUP_ID: group.$(APP_BUNDLE_ID)
    DEVELOPMENT_TEAM: 49JJS8FBS6
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"

packages:
  BlockerKit:
    path: Packages/BlockerKit

targetTemplates:
  ContentBlocker:
    type: app-extension
    platform: iOS
    sources:
      - Extensions/ContentBlocker
    dependencies:
      - package: BlockerKit
        product: BlockerShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).blocker.${category}
        CODE_SIGN_ENTITLEMENTS: Extensions/ContentBlocker/ContentBlocker.entitlements
    info:
      path: Extensions/Generated/${target_name}-Info.plist
      properties:
        CFBundleDisplayName: Hush ${title}
        AppGroupIdentifier: $(APP_GROUP_ID)
        BlockerCategory: ${category}
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.content-blocker
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).ContentBlockerRequestHandler

targets:
  Hush:
    type: application
    platform: iOS
    sources:
      - App
      # Shown in About & licenses (GPLv3 section 5(d) and MIT notice terms).
      - path: LICENSE
        buildPhase: resources
      - path: THIRD_PARTY_NOTICES.md
        buildPhase: resources
    dependencies:
      - package: BlockerKit
        product: BlockerKit
      - target: AdsBlocker
      - target: PrivacyBlocker
      - target: AnnoyancesBlocker
      - target: RegionalBlocker
      - target: CustomBlocker
      - target: YouTubeExtension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID)
        CODE_SIGN_ENTITLEMENTS: App/Hush.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Hush
        AppGroupIdentifier: $(APP_GROUP_ID)
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [$(PRODUCT_BUNDLE_IDENTIFIER).refresh]
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    scheme: {}

  AdsBlocker:
    templates: [ContentBlocker]
    templateAttributes: { category: ads, title: Block Ads }

  PrivacyBlocker:
    templates: [ContentBlocker]
    templateAttributes: { category: privacy, title: Preserve Privacy }

  AnnoyancesBlocker:
    templates: [ContentBlocker]
    templateAttributes: { category: annoyances, title: Eliminate Annoyances }

  RegionalBlocker:
    templates: [ContentBlocker]
    templateAttributes: { category: regional, title: Regional Ads }

  CustomBlocker:
    templates: [ContentBlocker]
    templateAttributes: { category: custom, title: Custom Rules }

  YouTubeExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: Extensions/YouTube/SafariWebExtensionHandler.swift
      # Safari expects these at the root of the extension bundle.
      - path: Extensions/YouTube/Resources/manifest.json
        buildPhase: resources
      - path: Extensions/YouTube/Resources/content.js
        buildPhase: resources
      - path: Extensions/YouTube/Resources/_locales
        type: folder
        buildPhase: resources
      - path: Extensions/YouTube/Resources/images
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(APP_BUNDLE_ID).youtube
    info:
      path: Extensions/YouTube/Info.plist
      properties:
        CFBundleDisplayName: Hush for YouTube
        NSExtension:
          NSExtensionPointIdentifier: com.apple.Safari.web-extension
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SafariWebExtensionHandler
